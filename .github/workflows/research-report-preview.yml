name: Research report preview
on:
  pull_request:
    branches: [main, 'feature/research-*']
    paths:
      - 'src/modules/analysis/research-report-html.ts'
      - 'src/modules/analysis/report-assembly-*.ts'
      - 'src/modules/analysis/report-kit-*.ts'
      - 'src/modules/analysis/report-section-pages.ts'
      - 'src/modules/analysis/report-located-insight-*.ts'
      - 'src/modules/analysis/located-insight-methods.ts'
      - 'src/modules/analysis/insight-corpus-counts.ts'
      - 'contracts/analysis/located-insight-methods.*'
      - 'src/modules/analysis/bounded-analysis-gates.ts'
      - 'src/modules/analysis/decision-evidence-packets.ts'
      - 'src/modules/analysis/report-method-packets-*.ts'
      - 'contracts/analysis/bounded-analysis-gates.*'
      - 'contracts/analysis/decision-evidence-packets.*'
      - 'contracts/analysis/report-method-packets-input.*'
      - 'src/modules/analysis/report-version-service.ts'
      - 'src/modules/analysis/prepared-report-assembly.ts'
      - 'src/modules/analysis/source-backed-report.ts'
      - 'src/modules/analysis/research-report-charts.ts'
      - 'src/modules/analysis/research-chart-spec.ts'
      - 'src/modules/analysis/versioned-report-packet.ts'
      - 'docs/research/report-section-catalog-v1.json'
      - 'scripts/read-metric-sheet.py'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/export-source-backed-report.ts'
      - 'tests/integration/source-backed-report.test.ts'
      - 'tests/helpers/capture-research-preview.mjs'
      - 'tests/integration/prepared-report-version.test.ts'
      - 'tests/helpers/prepared-report-fixture.ts'
      - 'tests/helpers/located-insight-package-fixture.ts'
      - 'tests/helpers/report-method-packets-fixture.ts'
      - 'tests/integration/prepared-report-method-packets.test.ts'
      - '.github/workflows/research-report-preview.yml'
permissions:
  contents: read
concurrency:
  group: research-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Exercise retained prepared report and legacy export
        id: exports
        env:
          TDN_RESEARCH_PREVIEW_DIR: ${{ runner.temp }}/research-report-preview
          TDN_RESEARCH_ASSEMBLY_PREVIEW_DIR: ${{ runner.temp }}/research-report-preview/assembly
          TDN_RESEARCH_KIT_PREVIEW_DIR: ${{ runner.temp }}/research-report-preview/kit
          TDN_RESEARCH_LOCATED_PREVIEW_DIR: ${{ runner.temp }}/research-report-preview/located
          TDN_RESEARCH_METHODS_PREVIEW_DIR: ${{ runner.temp }}/research-report-preview/methods
        run: node --import tsx --test tests/integration/source-backed-report.test.ts tests/integration/prepared-report-version.test.ts tests/integration/prepared-report-method-packets.test.ts
      - name: Capture desktop/mobile and print synthetic PDF on Linux
        env:
          TDN_RESEARCH_PREVIEW_DIR: ${{ runner.temp }}/research-report-preview
        run: node tests/helpers/capture-research-preview.mjs
      - name: Capture actual assembled report
        env:
          TDN_RESEARCH_PREVIEW_DIR: ${{ runner.temp }}/research-report-preview/assembly
          TDN_RESEARCH_PREVIEW_REPORT: report.html
        run: node tests/helpers/capture-research-preview.mjs
      - name: Capture the approved report-kit presentation
        env:
          TDN_RESEARCH_PREVIEW_DIR: ${{ runner.temp }}/research-report-preview/kit
          TDN_RESEARCH_PREVIEW_REPORT: report.html
        run: node tests/helpers/capture-research-preview.mjs
      - name: Capture located Insight with combined supplements
        id: located
        env:
          TDN_RESEARCH_PREVIEW_DIR: ${{ runner.temp }}/research-report-preview/located
          TDN_RESEARCH_PREVIEW_REPORT: report.html
        run: node tests/helpers/capture-research-preview.mjs
      - name: Capture bounded gates and synthesis with all supplements
        # A preceding PDF failure must not erase independent A44 HTML evidence.
        # The original failed step still fails this job; this is not a bypass.
        if: always() && steps.exports.outcome == 'success'
        env:
          TDN_RESEARCH_PREVIEW_DIR: ${{ runner.temp }}/research-report-preview/methods
          TDN_RESEARCH_PREVIEW_REPORT: report.html
        run: node tests/helpers/capture-research-preview.mjs
      - name: Diagnose failed located print without replacing acceptance evidence
        if: failure() && steps.located.outcome == 'failure'
        env:
          TDN_RESEARCH_PREVIEW_DIR: ${{ runner.temp }}/research-report-preview/located
          TDN_RESEARCH_PREVIEW_REPORT: report.html
          TDN_RESEARCH_PRINT_DIAGNOSTIC: table-flow
        run: node tests/helpers/capture-research-preview.mjs
      - name: Retain complete synthetic visual evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-report-synthetic-preview
          path: ${{ runner.temp }}/research-report-preview
          if-no-files-found: error
          retention-days: 7
