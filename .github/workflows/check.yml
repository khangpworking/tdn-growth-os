name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches:
      - main
      - 'feature/research-*'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      backend-shards: ${{ steps.shards.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Set up Node.js for shard coverage
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0

      - name: Verify every backend test runs exactly once
        id: shards
        shell: bash
        run: |
          shard_count=8
          printf '%s\0' tests/unit/*.test.ts tests/integration/*.test.ts | node scripts/ci/split-backend-tests.mjs verify "$shard_count"
          echo "matrix=$(node -e 'console.log(JSON.stringify(Array.from({length: Number(process.argv[1])}, (_, i) => i + 1)))' "$shard_count")" >> "$GITHUB_OUTPUT"

      - name: Select validation scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
          FULL_REQUESTED: ${{ contains(github.event.pull_request.labels.*.name, 'run-full-check') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          mode=full
          if [[ "$EVENT" == pull_request && "$BASE" == feature/research-* && "$DRAFT" == true && "$FULL_REQUESTED" != true ]]; then
            git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
            mode=research
            while IFS= read -r file; do
              case "$file" in
                docs/*.md|INTENT.md|README.md) ;;
                src/modules/analysis/m02-*|src/modules/analysis/m03-*|src/modules/analysis/m08-*|src/modules/analysis/m13-*|src/modules/analysis/i03-*|src/modules/analysis/i17-*|src/modules/analysis/metric-*|src/modules/analysis/report-*|src/modules/analysis/research-report-*|src/modules/analysis/research-chart-spec.ts|src/modules/analysis/source-backed-report.ts|src/modules/analysis/versioned-report-packet.ts|src/modules/analysis/section-artifact-retention-ledger.ts|src/modules/analysis/tablet-quote-normalizer.ts) ;;
                contracts/analysis/m02-*|contracts/analysis/m03-*|contracts/analysis/m08-*|contracts/analysis/m13-*|contracts/analysis/i03-*|contracts/analysis/i17-*|contracts/analysis/metric-*|contracts/analysis/report-*|contracts/analysis/research-report-*|contracts/analysis/research-chart-*|contracts/analysis/source-backed-report*|contracts/analysis/versioned-report*|contracts/analysis/section-artifact-*|contracts/analysis/tablet-quote-*) ;;
                tests/unit/metric-*|tests/unit/m02-*|tests/unit/m03-*|tests/unit/m08-*|tests/unit/m13-*|tests/unit/i03-*|tests/unit/i17-*|tests/unit/report-*|tests/unit/research-*|tests/unit/versioned-report*|tests/unit/tablet-quote-*|tests/unit/private-report-bundle*|tests/integration/metric-*|tests/integration/report-*|tests/integration/research-*|tests/integration/source-backed-report*|tests/integration/versioned-report*|tests/integration/section-artifact-*|tests/integration/prepared-report-*|tests/integration/bounded-ai-interpretation*|tests/integration/tablet-quote-*|tests/helpers/prepared-report-fixture.ts|tests/helpers/capture-research-preview.mjs|scripts/assemble-prepared-report.ts|.github/workflows/check.yml|.github/workflows/research-report-preview.yml) ;;
                *) mode=full ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi

          # Docs-only mode: PRs into main and pushes to main.
          # Any error, empty diff or missing SHA keeps mode=full.
          if [[ "$mode" == full && "$FULL_REQUESTED" != true ]]; then
            from=""
            to=""
            range=""
            if [[ "$EVENT" == pull_request && "$BASE" == main ]]; then
              from="$BASE_SHA"
              to="$HEAD_SHA"
              range="$BASE_SHA...$HEAD_SHA"
            elif [[ "$EVENT" == push && "$REF" == refs/heads/main ]]; then
              if [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
                from="$BEFORE_SHA"
                to="$AFTER_SHA"
                range="$BEFORE_SHA..$AFTER_SHA"
              fi
            fi
            if [[ -n "$range" && -n "$from" && -n "$to" ]]; then
              changed="$RUNNER_TEMP/changed-paths.z"
              if git fetch --no-tags origin "$from" "$to" \
                && git diff --name-only --no-renames -z "$range" > "$changed"; then
                selected="$(bash scripts/ci-select-scope.sh < "$changed")" || selected=full
                if [[ "$selected" == docs ]]; then
                  mode=docs
                fi
              else
                echo "Changed-path comparison failed; using full checks."
              fi
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Validation scope: $mode" >> "$GITHUB_STEP_SUMMARY"

  research:
    needs: scope
    if: needs.scope.outputs.mode == 'research'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run research iteration checks
        shell: bash
        run: |
          npm run contracts:generate
          npm run typecheck
          mapfile -t tests < <(find tests/unit tests/integration -maxdepth 1 -name '*.test.ts' | grep -E '/(metric-|m02-|m03-|m08-|m13-|i03-|i17-|report-|research-|source-backed-report|versioned-report|section-artifact-|prepared-report-|bounded-ai-interpretation|tablet-quote-|private-report-bundle)' | sort)
          test "${#tests[@]}" -gt 0
          node --import tsx --test "${tests[@]}"

      - name: Verify generated contracts were committed
        run: git diff --exit-code -- contracts

  prep:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate contracts
        run: npm run contracts:generate

      - name: Verify generated contracts were committed
        run: git diff --exit-code -- contracts

      - name: Typecheck backend
        run: npm run typecheck

      - name: Typecheck frontend
        run: npm run frontend:typecheck

      - name: Build frontend
        run: npm run frontend:build

      - name: Upload build outputs for test jobs
        uses: actions/upload-artifact@v4
        with:
          name: prep-build-outputs
          path: |
            frontend/dist
            frontend/src/generated/report-validators.generated.js
          if-no-files-found: error
          retention-days: 1

  backend:
    needs: [scope, prep]
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.backend-shards) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: prep-build-outputs
          path: frontend

      - name: Set up Python for PDF verification
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-pageindex.txt

      - name: Install pinned local PDF verifier
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r scripts/requirements-pageindex.txt

      - name: Run backend tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        shell: bash
        run: |
          export LC_ALL=C
          node scripts/ci/split-backend-tests.mjs list ${{ matrix.shard }} ${{ strategy.job-total }} > "$RUNNER_TEMP/backend-tests.z"
          mapfile -d '' -t tests < "$RUNNER_TEMP/backend-tests.z"
          node --import tsx --test "${tests[@]}"

  frontend:
    needs: [scope, prep]
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: prep-build-outputs
          path: frontend

      - name: Run frontend tests
        run: npm run frontend:test

  check:
    name: check
    needs: [scope, research, prep, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate required job results
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          MODE: ${{ needs.scope.outputs.mode }}
          RESEARCH_RESULT: ${{ needs.research.result }}
          PREP_RESULT: ${{ needs.prep.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        shell: bash
        run: |
          echo "scope=$SCOPE_RESULT mode=$MODE research=$RESEARCH_RESULT prep=$PREP_RESULT backend=$BACKEND_RESULT frontend=$FRONTEND_RESULT"
          if [[ "$SCOPE_RESULT" != success ]]; then
            echo "::error::scope job did not succeed ($SCOPE_RESULT)"
            exit 1
          fi
          case "$MODE" in
            docs)
              echo "docs-only: tests skipped"
              ;;
            research)
              if [[ "$RESEARCH_RESULT" != success ]]; then
                echo "::error::research job result: $RESEARCH_RESULT"
                exit 1
              fi
              ;;
            full)
              failed=0
              for pair in "prep=$PREP_RESULT" "backend=$BACKEND_RESULT" "frontend=$FRONTEND_RESULT"; do
                if [[ "${pair#*=}" != success ]]; then
                  echo "::error::${pair%%=*} job result: ${pair#*=}"
                  failed=1
                fi
              done
              exit "$failed"
              ;;
            *)
              echo "::error::unknown validation mode: '$MODE'"
              exit 1
              ;;
          esac
