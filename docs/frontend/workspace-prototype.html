<style>

*{box-sizing:border-box}body{margin:0;background:#dfe8ed;color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}button,a{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--teal);outline-offset:4px}::selection{background:#b8e7e2;color:var(--ink)}html{scrollbar-color:#94acb9 #eef2f5}input{caret-color:var(--blue)}a{color:var(--blue);text-underline-offset:4px}h1,h2,h3,p{margin-top:0}h1{font-size:32px;letter-spacing:-.03em;line-height:1.2;margin-bottom:8px}h2{font-size:20px;letter-spacing:-.02em;margin-bottom:14px}h3{font-size:16px;margin-bottom:8px}p{max-width:70ch}.muted{color:var(--muted)}small{font-size:12px}.topbar{background:var(--ink);color:white;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.mark{width:36px;height:36px;display:grid;place-items:center;background:#83d6d0;color:var(--ink);border-radius:11px;font-weight:900}.brand small{display:block;color:#bdd0db}.owner{display:flex;align-items:center;gap:9px;font-size:13px;color:#d3e3ea}.owner svg{width:20px;height:20px}.demo-bar{padding:10px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff4cf;color:#705012;font-size:12px}.demo-bar button{color:inherit;border:0;background:none;text-decoration:underline;text-underline-offset:3px;padding:7px}.frame{max-width:1400px;margin:32px auto 48px;padding:0 28px}.crumb{display:flex;align-items:center;gap:10px;margin-bottom:18px;color:var(--muted);font-size:13px}.crumb button{background:none;padding:4px 0;border:0;color:var(--blue)}.heading{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:24px}.heading p{margin-bottom:0;color:var(--muted)}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:10px 16px;border:1px solid #cbd9e2;border-radius:9px;background:white;color:var(--ink);font-size:13px;font-weight:700;text-decoration:none;transition:background .16s}.button:hover:not(:disabled){background:#eaf0f5}.button.primary{background:var(--blue);border-color:var(--blue);color:white}.button.primary:hover:not(:disabled){background:#1d469f}.button.quiet{background:transparent;border:0;color:var(--blue)}.button svg{width:16px;height:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}.stat{padding:20px 22px;background:white;border-radius:13px;border:1px solid var(--line)}.stat span{display:block;color:var(--muted);font-size:13px}.stat strong{display:block;font-size:32px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:3px 0}.stat small{color:var(--muted)}.overview-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px}.surface{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.surface-pad{padding:24px}.distribution-row{display:grid;grid-template-columns:98px 1fr 20px;align-items:center;gap:10px;margin:18px 0;font-size:13px}.track{height:10px;background:#edf2f5;border-radius:5px;overflow:hidden}.track i{display:block;height:100%;background:var(--c);width:var(--w);border-radius:5px}.distribution-row b{text-align:right;font-variant-numeric:tabular-nums}.legend-note{padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.tools{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 22px 16px}.tools h2{margin:0}.search{width:min(260px,100%);border:1px solid #b8c8d2;border-radius:8px;padding:10px 12px;background:white;color:var(--ink);font-size:13px}.search::placeholder{color:#617585}.table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}.table th{font-size:12px;color:var(--muted);font-weight:600;padding:12px 22px;background:#f5f8fa;border-bottom:1px solid var(--line)}.table td{padding:20px 22px;border-bottom:1px solid var(--line)}.table tr:last-child td{border-bottom:0}.table td strong{font-size:15px;display:block}.table td small{display:block;color:var(--muted);margin-top:4px}.table td:last-child{text-align:right}.badge{display:inline-flex;gap:7px;align-items:center;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:650;white-space:nowrap}.badge:before{content:"";width:6px;height:6px;background:currentColor;border-radius:50%}.pass{background:#e1f4ed;color:#186655}.hold{background:#fff4d5;color:#79520e}.reject{background:#fde9eb;color:#943643}.none{background:#edf2f5;color:#536a7c}.discovery{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:20px;padding:22px 24px;background:#edf3f6;border:1px solid #cddbe3;border-radius:14px}.discovery h2{font-size:16px;margin-bottom:4px}.discovery p{margin:0;color:var(--muted);font-size:13px}.discovery details{max-width:500px;font-size:13px;color:var(--muted)}summary{cursor:pointer;color:var(--blue)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}.step{padding:12px 15px;background:#edf2f5;border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:13px}.step b{display:block}.step small{font-size:11px}.step.done{background:#e1f4ed;color:#186655;border-color:#c6e7d9}.step.current{background:var(--teal);color:white;border-color:var(--teal)}.dossier{display:grid;grid-template-columns:210px minmax(0,1fr) 264px;background:white;border-radius:17px;overflow:hidden;box-shadow:var(--shadow);min-height:560px}.side{padding:24px 18px;background:#f5f7f8;border-right:1px solid var(--line)}.candidate{padding:16px;background:white;border:1px solid #d7e1e5;border-radius:13px}.candidate span{font-size:12px;color:var(--blue);font-weight:700}.candidate h2{font-size:19px;line-height:1.3;margin:10px 0}.candidate p{font-size:12px;color:var(--muted);margin:0}.side nav{display:grid;gap:6px;margin-top:24px}.nav-button{background:none;border:0;text-align:left;padding:12px;color:var(--muted);border-radius:8px;font-size:13px;font-weight:650}.nav-button:hover{background:#eaf0f5}.nav-button.active{color:#1f4ea8;background:#e1ebff}.content{min-width:0;padding:28px}.content>p{font-size:13px;color:var(--muted)}.evidence{padding:18px;background:#f8fafb;border:1px solid #e1e8ec;border-radius:12px;margin:20px 0}.evidence p{margin:0;font-size:13px;color:var(--muted)}.source-row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:14px;padding-top:14px;font-size:12px}.source-row b{display:block;margin-top:4px}.lanes{display:grid;gap:8px}.lane{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid var(--line);border-radius:10px;background:white;text-align:left;color:var(--ink)}.lane:hover{background:#f3f7fb}.lane.selected{border:2px solid var(--blue);padding:13px;background:#f4f7ff}.lane strong{font-size:14px}.lane small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.decision{padding:25px 20px;background:#f8fafc;border-left:1px solid var(--line)}.decision p{font-size:13px;color:var(--muted)}.decision select{width:100%;border:1px solid #b8c8d2;border-radius:8px;background:white;color:var(--ink);padding:10px;margin:10px 0 18px}.decision-actions{display:grid;gap:9px}.decision-actions button{border:1px solid #cddce3;border-radius:9px;padding:12px 14px;text-align:left;font-size:13px;font-weight:750}.decision-actions button:hover:not(:disabled){filter:brightness(.96)}.snapshot{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);font-size:12px}.snapshot p{font-size:12px}.snapshot .button{width:100%;margin-top:12px}.timeline{margin:18px 0 0;padding:0;list-style:none}.timeline li{padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.timeline small{display:block;color:var(--muted)}.empty{padding:48px 24px;text-align:center}.empty p{margin:8px auto 20px;color:var(--muted);font-size:14px}.view-options{margin-top:24px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}.view-options select{padding:8px;border:1px solid #b8c8d2;border-radius:8px;color:var(--ink);background:white}.caption{margin:24px 0 0;color:var(--muted);font-size:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;background:var(--ink);color:white;box-shadow:var(--shadow);border-radius:10px;max-width:calc(100% - 32px);font-size:13px;z-index:20}.toast:empty{display:none}.view{animation:arrive .22s cubic-bezier(.16,1,.3,1)}@keyframes arrive{from{transform:translateY(6px)}to{transform:translateY(0)}}.loading{padding:50px;text-align:center}.loading progress{accent-color:var(--teal);max-width:100%}.error{padding:32px;color:var(--red)}.skip{position:absolute;left:12px;top:-100px;background:white;padding:12px;z-index:100}.skip:focus{top:12px}

.brand small,.demo-bar,.stat span,.stat small,.step small,.lane small{font-size:12px}

<body>
<a class="skip" href="#main">Bỏ qua điều hướng</a>
<header class="topbar"><div class="brand"><span class="mark">T</span><div><strong>TDN Growth OS</strong><small>Không gian phát triển sản phẩm</small></div></div><div class="owner"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/></svg>Chủ dự án</div></header>
<div class="demo-bar"><span>Dữ liệu minh họa · Thao tác chỉ có hiệu lực trong bản demo</span><button id="reset">Đặt lại demo</button></div>
<main id="main" class="frame" tabindex="-1"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const lanes=[['LEGAL','Pháp lý'],['SCIENTIFIC','Khoa học'],['QUALITY','Chất lượng'],['FINANCE','Tài chính']];
const labels={PASS:'Đạt',HOLD:'Tạm giữ',REJECT:'Không đạt',NONE:'Chưa đánh giá'};
const css={PASS:'pass',HOLD:'hold',REJECT:'reject',NONE:'none'};
const calciumInitial=()=>[{id:'adult',name:'Canxi cho người lớn',summary:'Ứng viên dành cho người trưởng thành. Nội dung này minh họa bản tóm tắt được giữ lại khi tạo workspace sản phẩm.',states:{LEGAL:'NONE',SCIENTIFIC:'PASS',QUALITY:'HOLD',FINANCE:'NONE'},history:[{lane:'QUALITY',state:'HOLD',time:'09:40 · minh họa'},{lane:'SCIENTIFIC',state:'PASS',time:'09:20 · minh họa'}],clearance:null},{id:'child',name:'Canxi cho trẻ em',summary:'Ứng viên dành cho trẻ em, có hồ sơ và các quyết định độc lập với sản phẩm cho người lớn.',states:{LEGAL:'NONE',SCIENTIFIC:'NONE',QUALITY:'NONE',FINANCE:'NONE'},history:[],clearance:null}];
const marketInitial=()=>[{id:'calcium',name:'Thị trường canxi',keywords:'canxi, calcium',candidates:[{name:'Canxi cho người lớn',productId:'adult'},{name:'Canxi cho trẻ em',productId:'child'}],note:'Hai ứng viên minh họa đã qua B7; tiếp tục khám phá thêm cơ hội.'},{id:'collagen',name:'Thị trường collagen',keywords:'collagen',candidates:[{name:'Collagen dạng nước',productId:'collagen-liquid'},{name:'Collagen dạng bột',productId:null}],note:'Một ứng viên đã qua B7, một ứng viên tiếp tục khám phá.'},{id:'sleep',name:'Chăm sóc giấc ngủ',keywords:'giấc ngủ, sleep',candidates:[{name:'Sản phẩm hỗ trợ thói quen ngủ',productId:null}],note:'Đang khám phá cơ hội; chưa có quyết định B7 hoặc hồ sơ sản phẩm.'}];
const initial=()=>[...calciumInitial().map(p=>({...p,marketId:'calcium'})),{id:'collagen-liquid',marketId:'collagen',name:'Collagen dạng nước',summary:'Ứng viên dạng nước trong thị trường collagen. Đây là nội dung minh họa, chưa phải kết luận nghiên cứu.',states:{LEGAL:'NONE',SCIENTIFIC:'NONE',QUALITY:'NONE',FINANCE:'NONE'},history:[],clearance:null}];
let markets=marketInitial(),currentMarket=null,marketSearch='',showCreate=false;
const scopedProducts=()=>products.filter(p=>p.marketId===currentMarket);
let products=initial(),current=null,section='b8',selected='LEGAL',search='',scenario='normal',timer;
const main=document.getElementById('main');
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=s=>`<span class="badge ${css[s]}">${labels[s]}</span>`;
const count=(p,state)=>Object.values(p.states).filter(s=>s===state).length;
const arrow='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>';
function notify(message){clearTimeout(timer);document.getElementById('toast').textContent=message;timer=setTimeout(()=>document.getElementById('toast').textContent='',4500)}
function go(id){current=id;if(id)currentMarket=products.find(p=>p.id===id).marketId;section='b8';selected='LEGAL';scenario='normal';search='';history.pushState(null,'',id?'#product-'+id:currentMarket?'#market-'+currentMarket:'#overview');render();main.focus();window.scrollTo(0,0)}
function openMarket(id){currentMarket=id;showCreate=false;go(null)}
function marketNavigation(){return `<div class="market-navigation"><button class="button quiet" data-all>Tất cả thị trường</button><label for="market-switch">Chuyển thị trường</label><select id="market-switch">${markets.map(m=>`<option value="${m.id}" ${m.id===currentMarket?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>`}
function discovery(){const m=markets.find(x=>x.id===currentMarket);const ps=scopedProducts();return `<section class="surface surface-pad discovery-section"><h2>Khám phá và rổ cơ hội</h2><p class="muted">${esc(m.note)}</p><div class="candidate-list">${m.candidates.length?m.candidates.map((candidate,i)=>`<div class="candidate-item"><div><strong>${esc(candidate.name)}</strong><small>Ứng viên minh họa ${i+1}</small></div><span class="badge ${ps.some(p=>p.id===candidate.productId)?'pass':'none'}">${ps.some(p=>p.id===candidate.productId)?'Đã tách hồ sơ sau B7':'Đang khám phá'}</span></div>`).join(''):'<p class="muted">Chưa có ứng viên. Bắt đầu bằng việc xác định phạm vi và bổ sung tài liệu nghiên cứu.</p>'}</div><details><summary>Tài liệu và báo cáo nghiên cứu</summary><p>Chưa gắn báo cáo trong demo. Mỗi thị trường có phạm vi và nguồn riêng. Methodology B2 đang chờ hoàn thiện; không tự chạy thu thập khi tạo thị trường.</p></details></section>`}
function marketRows(){const list=markets.filter(m=>(m.name+' '+m.keywords).toLocaleLowerCase('vi').includes(marketSearch.toLocaleLowerCase('vi')));return list.length?list.map(m=>{const ps=products.filter(p=>p.marketId===m.id);return `<tr><td><strong>${esc(m.name)}</strong><small>${esc(m.keywords||'Chưa có từ khóa')}</small></td><td><span class="market-counts">${m.candidates.length} ứng viên · ${ps.length} hồ sơ sản phẩm</span><small>${ps.length?'Đang khám phá và thẩm định':'Khám phá cơ hội'}</small></td><td><button class="button quiet" data-market="${m.id}" aria-label="Mở ${esc(m.name)}">Mở thị trường ${arrow}</button></td></tr>`}).join(''):'<tr><td colspan="3"><div class="empty"><h3>Không tìm thấy thị trường</h3><p>Thử từ khóa khác hoặc xóa tìm kiếm.</p><button class="button" data-clear-market>Xóa tìm kiếm</button></div></td></tr>'}
function portfolio(){return `<div class="heading"><div><h1>Các thị trường đang nghiên cứu</h1><p>Mỗi thị trường là một workspace khám phá riêng.</p></div><button class="button primary" data-create>Tạo nghiên cứu mới</button></div>${showCreate?`<section class="surface surface-pad create-research"><h2>Tạo nghiên cứu minh họa</h2><p class="muted">Tạo workspace trống trong demo; chưa thu thập dữ liệu.</p><form id="create-market"><label>Tên thị trường<input class="search" name="name" required maxlength="100" placeholder="Ví dụ: Dinh dưỡng thể thao"></label><label>Từ khóa ban đầu<input class="search" name="keywords" maxlength="180" placeholder="Ví dụ: protein, whey"></label><div class="form-actions"><button class="button primary" type="submit">Tạo workspace demo</button><button class="button" type="button" data-cancel-create>Hủy</button></div></form></section>`:''}<div class="stats"><div class="stat"><span>Thị trường</span><strong>${markets.length.toString().padStart(2,'0')}</strong><small>Workspace khám phá</small></div><div class="stat"><span>Ứng viên</span><strong>${markets.reduce((n,m)=>n+m.candidates.length,0).toString().padStart(2,'0')}</strong><small>Trong các rổ cơ hội</small></div><div class="stat"><span>Hồ sơ sản phẩm</span><strong>${products.length.toString().padStart(2,'0')}</strong><small>Đã tách sau B7</small></div></div><section class="surface market-table"><div class="tools"><h2>Danh sách thị trường</h2><input id="market-search" class="search" type="search" value="${esc(marketSearch)}" placeholder="Tìm thị trường hoặc từ khóa…" aria-label="Tìm thị trường"></div><table class="table"><thead><tr><th scope="col">Thị trường</th><th scope="col">Khám phá và sản phẩm</th><th scope="col">Chi tiết</th></tr></thead><tbody id="market-rows">${marketRows()}</tbody></table></section><p class="caption">Chọn một thị trường để xem nghiên cứu chung, rổ cơ hội và các hồ sơ sản phẩm. Sản phẩm sau B7 giữ quyết định độc lập.</p>`}

function rows(){const list=scopedProducts().filter(p=>p.name.toLocaleLowerCase('vi').includes(search.toLocaleLowerCase('vi')));return list.length?list.map(p=>`<tr><td><strong>${p.name}</strong><small>B8 · ${count(p,'PASS')}/4 lane đạt</small></td><td><span class="badge ${count(p,'PASS')===4?'pass':'none'}">${count(p,'PASS')===4?'4 lane đạt':Object.values(p.states).some(s=>s!=='NONE')?'Đang thẩm định':'Chưa đánh giá'}</span></td><td><button class="button quiet" data-open="${p.id}" aria-label="Mở ${p.name}">Mở hồ sơ ${arrow}</button></td></tr>`).join(''):`<tr><td colspan="3"><div class="empty"><h3>${search?'Không tìm thấy workspace':'Chưa có hồ sơ sản phẩm'}</h3><p>${search?'Thử từ khóa khác hoặc xóa tìm kiếm.':'Các ứng viên vẫn có thể được nghiên cứu trong rổ cơ hội bên dưới. Hồ sơ sản phẩm chỉ xuất hiện sau bước chọn B7 và tạo workspace.'}</p>${search?'<button class="button" data-clear-search>Xóa tìm kiếm</button>':''}</div></td></tr>`}
function overview(){const products=scopedProducts();const states=products.flatMap(p=>Object.values(p.states));const totals=Object.fromEntries(['PASS','HOLD','REJECT','NONE'].map(s=>[s,states.filter(x=>x===s).length]));return `<div class="heading"><div><h1>${esc(markets.find(m=>m.id===currentMarket).name)}</h1><p>Nghiên cứu chung, rổ cơ hội và hồ sơ sản phẩm của thị trường này.</p></div><span class="badge none">${products.length} workspace sản phẩm</span></div><div class="stats"><div class="stat"><span>Workspace sản phẩm</span><strong>${products.length.toString().padStart(2,'0')}</strong><small>Tách biệt sau B7</small></div><div class="stat"><span>Lane chưa đạt</span><strong>${(states.length-totals.PASS).toString().padStart(2,'0')}</strong><small>Trong ${states.length} lane B8</small></div><div class="stat"><span>B8 hiện có 4 Đạt</span><strong>${products.filter(p=>count(p,'PASS')===4).length.toString().padStart(2,'0')}</strong><small>Có thể kiểm tra bước B9</small></div></div><div class="overview-grid"><section class="surface surface-pad"><h2>Bức tranh thẩm định</h2><p class="muted" style="font-size:13px">Trạng thái hiện hành của ${states.length} lane B8.</p><div class="distribution" role="img" aria-label="${totals.PASS} đạt, ${totals.HOLD} tạm giữ, ${totals.REJECT} không đạt, ${totals.NONE} chưa đánh giá">${['PASS','HOLD','REJECT','NONE'].map(s=>`<div class="distribution-row"><span>${labels[s]}</span><span class="track"><i style="--w:${(states.length?totals[s]/states.length*100:0)}%;--c:${{PASS:'var(--green)',HOLD:'#cf9b36',REJECT:'var(--red)',NONE:'#a4b5c1'}[s]}"></i></span><b>${totals[s]}</b></div>`).join('')}</div><p class="legend-note">Mỗi sản phẩm có 4 lane độc lập. Biểu đồ đếm quyết định, không đánh giá chất lượng sản phẩm.</p></section><section class="surface"><div class="tools"><h2>Hồ sơ sản phẩm</h2><input class="search" type="search" id="search" aria-label="Tìm workspace" placeholder="Tìm workspace…" value="${esc(search)}"></div><table class="table"><thead><tr><th scope="col">Workspace</th><th scope="col">Trạng thái</th><th scope="col"><span class="muted">Chi tiết</span></th></tr></thead><tbody id="rows">${rows()}</tbody></table></section></div>${discovery()}`}
function historyView(p){return `<h2>Lịch sử quyết định B8</h2><p>Các quyết định trước được giữ lại khi bạn đổi trạng thái.</p>${p.history.length?`<ol class="timeline">${p.history.map(e=>`<li><strong>${lanes.find(l=>l[0]===e.lane)[1]}</strong> · ${labels[e.state]}<small>Chủ dự án · ${e.time}</small></li>`).join('')}</ol>`:'<div class="empty"><h3>Chưa có quyết định</h3><p>Chọn một lane ở B8 để bắt đầu.</p></div>'}`}
function content(p){if(section==='history')return historyView(p);if(section==='sources')return '<h2>Bằng chứng của hồ sơ</h2><p>Các tài liệu được gắn với đúng hồ sơ sẽ xuất hiện tại đây.</p><div class="evidence"><h3>Chưa có báo cáo được gắn</h3><p>Không có số liệu thị trường hoặc review thật trong demo này. Methodology và định dạng báo cáo B2 đang được chủ dự án chuẩn bị.</p></div><details><summary>Xem nguồn hình thành workspace</summary><p>Ứng viên v1 → Rổ cơ hội v1 → B7 Đạt → Workspace sản phẩm. Chuỗi này là dữ liệu minh họa cho cách hiển thị nguồn.</p></details>';
if(section==='b9')return `<h2>B9 · Khóa STP</h2><div class="empty"><h3>${p.clearance?'Sẵn sàng chuẩn bị STP':'Cần xác nhận B8 trước'}</h3><p>${p.clearance?'B8 đã có snapshot xác nhận trong demo. B9 v1 gồm một bản STP đang soạn và một bản khóa chính thức. Form STP sẽ được dựng ở bước giao diện tiếp theo.':'Hồ sơ cần bốn quyết định Đạt và thao tác xác nhận đủ điều kiện B9.'}</p><button class="button" data-section="b8">Quay lại B8</button></div>`;
if(section==='b10')return '<h2>B10 · Danh mục và cấp vốn</h2><div class="empty"><h3>Chưa có STP đã khóa</h3><p>Sau B9, chủ dự án đưa ra một quyết định chung: Duyệt, Tạm giữ hoặc Từ chối. Có thể sửa quyết định và giữ lịch sử. Màn hình thao tác B10 sẽ được dựng sau.</p><button class="button" data-section="b9">Xem điều kiện B9</button></div>';
return `<h2>B8 · Thẩm định sản phẩm</h2><p>Chọn một lane để xem và cập nhật quyết định.</p><div class="evidence"><h3>Tóm tắt ứng viên</h3><p>${p.summary}</p><div class="source-row"><span>Nguồn lựa chọn<b>B7 · Đạt · Ứng viên v1</b></span><span>Bản tóm tắt<b>Giữ nguyên từ lúc tạo</b></span></div></div><div class="lanes" aria-label="Bốn lane thẩm định">${lanes.map(([key,name])=>`<button class="lane ${selected===key?'selected':''}" data-lane="${key}" aria-pressed="${selected===key}"><span><strong>${name}</strong><small>${key}</small></span>${badge(p.states[key])}</button>`).join('')}</div>`}
function detail(){const p=products.find(x=>x.id===current);return `<nav class="crumb" aria-label="Đường dẫn"><button data-home>${esc(markets.find(m=>m.id===currentMarket).name)}</button><span aria-hidden="true">/</span><span>${p.name}</span></nav><div class="heading"><div><h1>${p.name}</h1><p>Hồ sơ sản phẩm độc lập · Bắt đầu từ B7 Đạt</p></div><span class="badge none">Dữ liệu minh họa</span></div><div class="steps" aria-label="Các bước hồ sơ"><div class="step done"><b>B7 · Đã chọn</b><small>Ứng viên v1</small></div><div class="step ${section==='b8'?'current':p.clearance?'done':''}"><b>B8 · Thẩm định</b><small>${count(p,'PASS')}/4 lane đang Đạt</small></div><div class="step ${section==='b9'?'current':''}"><b>B9 · Khóa STP</b><small>${p.clearance?'Chưa có bản STP':'Chờ xác nhận B8'}</small></div><div class="step ${section==='b10'?'current':''}"><b>B10 · Phê duyệt</b><small>Chờ STP đã khóa</small></div></div><div class="dossier"><aside class="side"><div class="candidate"><span>Ứng viên v1</span><h2>${p.name}</h2><p>Hồ sơ và quyết định được quản lý riêng.</p></div><nav aria-label="Các phần hồ sơ">${[['b8','B8 · Thẩm định'],['sources','Bằng chứng'],['history','Lịch sử B8'],['b9','B9 · Khóa STP'],['b10','B10 · Phê duyệt']].map(([key,label])=>`<button class="nav-button ${section===key?'active':''}" data-section="${key}" ${section===key?'aria-current="page"':''}>${label}</button>`).join('')}</nav></aside><section class="content">${content(p)}</section><aside class="decision"><h2>Quyết định lane</h2><label for="lane" class="muted">Lane đang xem</label><select id="lane">${lanes.map(([key,name])=>`<option value="${key}" ${key===selected?'selected':''}>${name}</option>`).join('')}</select><p>Hiện tại: ${badge(p.states[selected])}</p><div class="decision-actions">${['PASS','HOLD','REJECT'].map(s=>`<button class="${css[s]}" data-decide="${s}" ${p.states[selected]===s?'disabled':''}>${labels[s]}</button>`).join('')}</div><p style="font-size:12px;margin-top:14px">Không cần nhập lý do. Đổi trạng thái sẽ thêm một quyết định vào lịch sử demo.</p><div class="snapshot"><h3>Điều kiện chuyển bước</h3><p>${p.clearance?`Đã xác nhận B8 lúc ${p.clearance}. Snapshot này giữ nguyên khi các lane được đánh giá lại.`:`Cần 4 lane Đạt để xác nhận B8. Hiện có ${count(p,'PASS')}/4.`}</p>${p.clearance?`<button class="button primary" data-section="b9">Xem B9 ${arrow}</button>`:`<button class="button primary" data-clearance ${count(p,'PASS')===4?'':'disabled'}>Xác nhận đủ điều kiện B9</button>`}</div></aside></div>`}
function render(){main.innerHTML=`${currentMarket?marketNavigation():''}<div class="view">${current?detail():scenario==='normal'?(currentMarket?overview():portfolio()):scenario==='empty'?'<div class="surface empty"><h1>Chưa có workspace sản phẩm</h1><p>Sau khi chọn ứng viên ở B7, bạn có thể tạo hồ sơ sản phẩm độc lập. Dùng demo có sẵn để xem trước luồng này.</p><button class="button primary" data-restore>Xem dữ liệu demo</button></div>':scenario==='error'?'<div class="surface error"><h1>Chưa tải được workspace</h1><p>Không thể đọc dữ liệu lúc này. Hãy thử tải lại.</p><button class="button" data-restore>Thử lại</button></div>':'<div class="surface loading" role="status"><h1>Đang tải workspace</h1><progress aria-label="Đang tải"></progress><p>Đây là trạng thái chờ minh họa.</p></div>'}</div>${!current?`<div class="view-options"><label for="scenario">Xem trạng thái giao diện:</label><select id="scenario"><option value="normal" ${scenario==='normal'?'selected':''}>Có dữ liệu demo</option><option value="empty" ${scenario==='empty'?'selected':''}>Chưa có workspace</option><option value="loading" ${scenario==='loading'?'selected':''}>Đang tải</option><option value="error" ${scenario==='error'?'selected':''}>Lỗi tải dữ liệu</option></select></div>`:''}<p class="caption">Prototype tương tác · Phong cách từ Option 3 + Option 2 · Mọi thao tác được đặt lại khi tải lại trang.</p>`}
main.addEventListener('input',e=>{if(e.target.id==='market-search'){marketSearch=e.target.value;document.getElementById('market-rows').innerHTML=marketRows()}if(e.target.id==='search'){search=e.target.value;document.getElementById('rows').innerHTML=rows()}});
main.addEventListener('change',e=>{if(e.target.id==='market-switch'){openMarket(e.target.value);return}if(e.target.id==='scenario'){scenario=e.target.value;render()}if(e.target.id==='lane'){selected=e.target.value;render();document.getElementById('lane').focus()}});
main.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.hasAttribute('data-all'))return openMarket(null);if(b.hasAttribute('data-market'))return openMarket(b.dataset.market);if(b.hasAttribute('data-create')){showCreate=true;render();main.querySelector('[name="name"]').focus();return}if(b.hasAttribute('data-cancel-create')){showCreate=false;render();return}if(b.hasAttribute('data-clear-market')){marketSearch='';render();document.getElementById('market-search').focus();return}if(b.hasAttribute('data-open'))return go(b.dataset.open);if(b.hasAttribute('data-home'))return go(null);if(b.hasAttribute('data-clear-search')){search='';render();document.getElementById('search').focus();return}if(b.hasAttribute('data-restore')){scenario='normal';render();return}if(b.hasAttribute('data-section')){section=b.dataset.section;render();main.querySelector('.content h2')?.setAttribute('tabindex','-1');main.querySelector('.content h2')?.focus();return}if(b.hasAttribute('data-lane')){selected=b.dataset.lane;render();main.querySelector(`[data-lane="${selected}"]`).focus();return}const p=products.find(x=>x.id===current);if(b.hasAttribute('data-decide')){p.states[selected]=b.dataset.decide;p.history.unshift({lane:selected,state:b.dataset.decide,time:new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})+' · trong demo'});render();document.getElementById('lane').focus();notify('Đã cập nhật '+lanes.find(l=>l[0]===selected)[1]+': '+labels[b.dataset.decide]+' — chỉ trong demo.')}if(b.hasAttribute('data-clearance')&&count(p,'PASS')===4&&!p.clearance){p.clearance=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});render();notify('Đã tạo snapshot B8 minh họa. Bạn có thể xem bước B9.')}});
document.getElementById('reset').addEventListener('click',()=>{products=initial();markets=marketInitial();currentMarket=null;marketSearch='';showCreate=false;search='';scenario='normal';go(null);notify('Đã đặt lại toàn bộ dữ liệu demo.')});
function restoreRoute(){current=products.find(p=>location.hash==='#product-'+p.id)?.id||null;currentMarket=current?products.find(p=>p.id===current).marketId:markets.find(m=>location.hash==='#market-'+m.id)?.id||null;section='b8';search='';scenario='normal';render()}
main.addEventListener('submit',e=>{if(e.target.id!=='create-market')return;e.preventDefault();const form=e.target;const name=form.elements.name.value.trim();if(!name){form.elements.name.setCustomValidity('Nhập tên thị trường.');form.elements.name.reportValidity();return}form.elements.name.setCustomValidity('');const id='market-'+Date.now();markets.push({id,name,keywords:form.elements.keywords.value.trim(),candidates:[],note:'Workspace mới chưa có dữ liệu nghiên cứu hoặc ứng viên.'});showCreate=false;openMarket(id);notify('Đã tạo thị trường minh họa. Chưa chạy nghiên cứu hoặc thu thập dữ liệu.')});
main.addEventListener('input',e=>{if(e.target.name==='name')e.target.setCustomValidity('')});
window.addEventListener('popstate',restoreRoute);restoreRoute();
</script>
</body>
</html>
